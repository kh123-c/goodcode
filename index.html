<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>اندازه‌گیری کارگاه</title>
<meta name="theme-color" content="#2f4858">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{
  --bg:#f3f1ec; --surface:#ffffff; --ink:#1f2a33; --muted:#66727c;
  --line:#d6d2c8; --accent:#f2b705; --accent-ink:#1f2a33; --steel:#2f4858; --danger:#b3261e;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#161c21; --surface:#1f272d; --ink:#eceae4; --muted:#9aa5ad;
    --line:#37424b; --accent:#f2b705; --accent-ink:#1b1b1b; --steel:#8fb3c7; --danger:#ff8a80;
    color-scheme: dark;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Vazirmatn,Tahoma,"Segoe UI",sans-serif;line-height:1.6}
.ruler{height:22px;background:
  repeating-linear-gradient(to left,var(--steel) 0 1px,transparent 1px 10px),
  repeating-linear-gradient(to left,var(--steel) 0 2px,transparent 2px 50px);
  background-size:100% 8px,100% 16px;background-repeat:repeat-x,repeat-x;background-position:bottom,bottom;
  border-bottom:2px solid var(--steel);opacity:.8}
main{max-width:980px;margin:0 auto;padding:16px 16px 90px}
h1{font-size:22px;margin:12px 0 2px}
h2{font-size:18px;margin:0 0 8px}
.sub{color:var(--muted);margin:0 0 14px;font-size:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
label,.lbl{display:block;font-size:14px;color:var(--muted);margin:10px 0 4px}
input[type=text],input[type=number],select,textarea{width:100%;font:inherit;font-size:17px;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:8px;padding:10px 12px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:2px 10px}
.fields .wide{grid-column:1/-1}
.num{direction:ltr;text-align:center;font-size:22px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative;margin:0}
.chip input{position:absolute;opacity:0;inset:0;width:100%;height:100%;cursor:pointer;margin:0}
.chip span{display:block;padding:9px 14px;border:1.5px solid var(--line);border-radius:999px;background:var(--bg);font-size:15px;color:var(--ink)}
.chip input:checked + span{background:var(--steel);color:var(--bg);border-color:var(--steel);font-weight:600}
.chip input:focus-visible + span{outline:3px solid var(--accent)}
.sw{display:inline-block;width:12px;height:12px;border-radius:50%;margin-left:6px;vertical-align:middle;border:1px solid rgba(0,0,0,.3)}
button{font:inherit;cursor:pointer;border-radius:8px;border:1.5px solid var(--steel);background:transparent;color:var(--ink);padding:10px 14px}
.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700;font-size:17px;padding:12px 18px}
.danger{color:var(--danger);border-color:var(--danger)}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.bar .grow{flex:1;min-width:160px}
.proj{display:block;width:100%;text-align:right;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.proj b{font-size:17px}
.meta{color:var(--muted);font-size:14px}
.item{border-top:1px solid var(--line);padding:10px 0;display:flex;gap:10px;align-items:flex-start}
.item:first-child{border-top:0}
.item .txt{flex:1}
.item img{width:110px;height:70px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:6px}
.fw.err{outline:2px solid var(--danger);border-radius:8px;padding:4px;margin:2px 0}
.calc{font-size:24px;font-weight:700;direction:ltr;text-align:center;background:var(--bg);border:2px dashed var(--accent);border-radius:8px;padding:8px}
.dims{direction:ltr;display:inline-block;font-weight:700;color:var(--steel)}
.empty{color:var(--muted);text-align:center;padding:14px}
.split{display:grid;grid-template-columns:1fr;gap:14px}
@media (min-width:820px){.split{grid-template-columns:1fr 1fr}}
canvas{width:100%;height:auto;aspect-ratio:8/5;background:#fff;border:1.5px solid var(--line);border-radius:8px;touch-action:none;display:block}
.tabs{display:flex;gap:8px;margin-bottom:8px}
.side-row{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-bottom:6px}
.side-row input{font-size:16px;padding:8px;direction:ltr;text-align:center}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--steel);color:var(--bg);padding:10px 18px;border-radius:8px;font-size:15px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.toast.on{opacity:1}
.warn{background:#fff3cd;color:#5c4400;border-radius:8px;padding:8px 12px;font-size:14px;margin-bottom:10px}
#print{display:none}
@media print{
  body{background:#fff;color:#000}
  #app,.ruler,.toast{display:none!important}
  #print{display:block;direction:rtl;font-size:13px;color:#000}
  #print h1{font-size:20px;margin:0 0 4px}
  #print .pi{border:1px solid #999;border-radius:6px;padding:8px;margin:10px 0;break-inside:avoid}
  #print table{width:100%;border-collapse:collapse}
  #print td{border:1px solid #bbb;padding:3px 6px}
  #print td:first-child{width:30%;background:#eee}
  #print img{max-width:100%;max-height:260px;border:1px solid #bbb;margin-top:6px}
}
@media (prefers-reduced-motion: reduce){.toast{transition:none}}
</style>
</head>
<body>
<div class="ruler" aria-hidden="true"></div>
<main id="app"></main>
<div id="print"></div>
<div class="toast" id="toast"></div>

<script>
/* ---------- تنظیمات فیلدها (اینجا قابل ویرایش است) ---------- */
const GLASS = [["شفاف","#cfe8e6"],["سوپر کلیر","#eef8f8"],["برنز","#9a6b3c"],["دودی","#4a4f54"],["ساتینا","#dfe3e6"],["مات","#e7e7e2"],["طرح‌دار","#c7d3da"],["لمینت","#b9d3c6"]];
const FRAME = [["سفید","#f5f5f5"],["مشکی","#1a1a1a"],["شامپاین","#d9c3a0"],["طرح چوب","#a1714a"],["طلایی","#c9a24b"],["اختصاصی",null]];
const f_glass = {k:"glass",l:"رنگ شیشه",t:"chips",o:GLASS,wide:1};
const f_thick = {k:"thick",l:"ضخامت شیشه",t:"chips",o:["۶ میل","۸ میل","۱۰ میل","۱۲ میل"],wide:1};
const f_frame = {k:"frame",l:"رنگ پروفیل / یراق",t:"chips",o:FRAME,wide:1};
const f_qty = {k:"qty",l:"تعداد (چند دست از همین اندازه)",t:"num",d:1};
const FIELDS = {
  "بالکن": v => {
    const n = x => parseFloat(String(x ?? "").replace(",", ".")) || 0;
    const yn = (k,l) => ({k,l,t:"chips",o:["ندارد","دارد"],d:"ندارد",wide:1});
    const on = k => v[k]==="دارد";
    const mode = {k:"bmode",l:"نوع بالکن",t:"chips",o:["صاف","زاویه‌دار"],d:"صاف",wide:1};
    if(v.bmode==="زاویه‌دار") return [mode,
      {k:"w",l:"طول کل (cm)",t:"num"},{k:"h",l:"ارتفاع (cm)",t:"num"},
      {k:"type",l:"نوع",t:"chips",o:["ریلی","لولایی","تاشو","ثابت"],wide:1},
      {k:"leaves",l:"تعداد لنگه",t:"num"}, f_glass, f_frame, f_qty];
    const aT = on("ahTop"), aB = on("ahBot"), aL = on("ahLeft"), aR = on("ahRight");
    const fx = v.fixed || "ندارد", fL = fx==="چپ" || fx==="چپ و راست", fR = fx==="راست" || fx==="چپ و راست";
    const wDiff = Math.abs(n(v.wb)-n(v.wt)), wBoth = n(v.wb)>0 && n(v.wt)>0;
    const L = [mode,
      {k:"hf",l:"ارتفاع تراز از کف (cm)",t:"num",noPdf:1},
      {k:"hc",l:"ارتفاع تراز از سقف (cm)",t:"num",noPdf:1},
      {k:"wb",l:"عرض پایین دهنه (cm)",t:"num",noPdf:1},
      {k:"wt",l:"عرض بالای دهنه (cm)",t:"num",noPdf:1}];
    if(wBoth && wDiff>5) L.push({k:"wDiffOk",l:"هشدار: اختلاف عرض پایین و بالا "+(Math.round(wDiff*10)/10)+" سانت است. اندازه‌ها را دوباره چک کردی؟",t:"chips",o:["تأیید می‌کنم، اختلاف "+(Math.round(wDiff*10)/10)+" cm"],okVal:"تأیید می‌کنم، اختلاف "+(Math.round(wDiff*10)/10)+" cm",wide:1,noPdf:1});
    L.push(
      {k:"h",l:"ارتفاع نهایی سفارش",t:"calc",hint:"ارتفاع از کف + ارتفاع از سقف"+((aT||aB)?" − کسر آهن‌کشی":""),
        c:v=> (v.hf==="" || v.hf===undefined) && (v.hc==="" || v.hc===undefined) ? null : n(v.hf)+n(v.hc)-((aT||aB)?n(v.cutH):0)},
      {k:"w",l:"عرض نهایی",t:"calc",hint:"کمترین عرض بین پایین و بالای دهنه"+((aL||aR)?" − کسر آهن‌کشی":""),
        c:v=>{ const a=[n(v.wb),n(v.wt)].filter(x=>x>0); return a.length ? Math.min(...a)-((aL||aR)?n(v.cutW):0) : null; }},
      {k:"fixed",l:"ثابت",t:"chips",o:["ندارد","چپ","راست","چپ و راست"],d:"ندارد",wide:1});
    if(fL) L.push({k:"fixWL",l:"عرض ثابت چپ (cm)",t:"num"});
    if(fR) L.push({k:"fixWR",l:"عرض ثابت راست (cm)",t:"num"});
    L.push({k:"curColor",l:"رنگ فریم",t:"chips",o:FRAME,wide:1}, f_glass,
      {k:"dir",l:"جهت بازشو",t:"chips",o:["راست","چپ","دو طرفه"],wide:1},
      yn("ahTop","آهن‌کشی بالا"));
    if(aT) L.push({k:"boxTypeTop",l:"نوع قوطی بالا",t:"text"});
    L.push(yn("ahBot","آهن‌کشی پایین"));
    if(aB) L.push({k:"boxTypeBot",l:"نوع قوطی پایین",t:"text"});
    L.push(yn("ahLeft","آهن‌کشی چپ"));
    if(aL) L.push({k:"boxTypeLeft",l:"نوع قوطی چپ",t:"text"});
    L.push(yn("ahRight","آهن‌کشی راست"));
    if(aR) L.push({k:"boxTypeRight",l:"نوع قوطی راست",t:"text"});
    if(aT||aB) L.push({k:"cutH",l:"چقدر بابت آهن‌کشی (بالا/پایین) از ارتفاع کم می‌شود؟ حتماً عدد بنویس؛ اگر چیزی کم نمی‌شود ۰ بنویس (cm)",short:"مقدار کسر ارتفاع بابت آهن‌کشی",t:"num",noPdf:1});
    if(aL||aR) L.push({k:"cutW",l:"چقدر بابت آهن‌کشی (چپ/راست) از عرض کم می‌شود؟ حتماً عدد بنویس؛ اگر چیزی کم نمی‌شود ۰ بنویس (cm)",short:"مقدار کسر عرض بابت آهن‌کشی",t:"num",noPdf:1});
    const wFin = (()=>{ const a=[n(v.wb),n(v.wt)].filter(x=>x>0); return a.length ? Math.min(...a)-((aL||aR)?n(v.cutW):0) : 0; })();
    const leafW = (v.leavesStd==="غیراستاندارد" && n(v.leavesN)>0 && wFin>0) ? (wFin-(fL?n(v.fixWL):0)-(fR?n(v.fixWR):0))/n(v.leavesN) : null;
    const leafWarn = (leafW!==null && (leafW<40 || leafW>65)) ? [{k:"leafErr", l:"خطا: هر لنگه حدود "+(Math.round(leafW*10)/10)+" سانت می‌شود ("+(leafW<40?"کمتر از ۴۰":"بیشتر از ۶۵")+") و قابل قبول نیست. تعداد لنگه را اصلاح کن.", t:"note", block:1, wide:1, noPdf:1}] : [];
    L.push({k:"leavesStd",l:"تعداد لنگه",t:"chips",o:["استاندارد","غیراستاندارد"],wide:1},
      ...(v.leavesStd==="غیراستاندارد" ? [{k:"leavesN",l:"تعداد لنگه (عدد)",t:"num"},
        {k:"leavesTotal",l:"تعداد لنگه کل (با ثابت)",t:"calc",u:" عدد",noPdf:1,hint:"لنگه‌ها + ثابت‌ها (هر ثابت یک لنگه)",c:v=> n(v.leavesN)>0 ? n(v.leavesN)+(fx==="چپ و راست"?2:((fx==="چپ"||fx==="راست")?1:0)) : null}] : []),
      ...leafWarn,
      yn("pack","جاساز / سوراخ در شیشه (جزئیات روی نقشه)"),
      yn("kat","کتیبه"));
    if(on("kat")) L.push(
      {k:"katW",l:"عرض دهنه کتیبه (cm)",t:"num"},{k:"katH",l:"ارتفاع دهنه کتیبه (cm)",t:"num"},
      {k:"katParts",l:"تعداد قسمت کتیبه",t:"num",d:1},
      {k:"katGlass",l:"شیشه کتیبه",t:"chips",o:["ساده","مات","طرح‌دار","همرنگ شیشه اصلی"],wide:1},
      {k:"katThick",l:"ضخامت شیشه کتیبه",t:"chips",o:["۸ میل","۱۰ میل"],wide:1},
      {k:"katFrame",l:"نوع فریم کتیبه",t:"chips",o:["پاسادیو دو تیکه","فریم ۵ سانت","سایر"],wide:1});
    if(on("kat") && v.katFrame==="سایر") L.push({k:"katFrameOther",l:"نوع فریم کتیبه (بنویس چه مدلی، چه جوری)",t:"text",req:1});
    if(on("kat")) L.push({k:"katNote",l:"توضیحات کتیبه",t:"text"});
    return L;
  },
  "اسلاید":[
    {k:"w",l:"طول (cm)",t:"num"},{k:"h",l:"ارتفاع (cm)",t:"num"},
    {k:"rails",l:"تعداد ریل",t:"chips",o:["۱","۲","۳"]},
    {k:"leaves",l:"تعداد لنگه",t:"num"},
    {k:"dir",l:"جهت لنگه متحرک",t:"chips",o:["راست","چپ","وسط"]},
    {k:"screen",l:"توری",t:"chips",o:["ندارد","دارد"]}, f_thick, f_glass, f_frame, f_qty
  ],
  "کابین دوش":[
    {k:"w",l:"طول (cm)",t:"num"},{k:"d",l:"عرض / عمق (cm)",t:"num"},{k:"h",l:"ارتفاع (cm)",t:"num"},
    {k:"shape",l:"مدل",t:"chips",o:["گوشه ۹۰","ثابت + درب","کشویی","شش‌ضلعی"]},
    {k:"dir",l:"جهت بازشو",t:"chips",o:["راست","چپ","دو طرفه"]},
    f_thick, f_glass, f_frame, f_qty
  ],
  "پارتیشن":[
    {k:"w",l:"طول (cm)",t:"num"},{k:"h",l:"ارتفاع (cm)",t:"num"},
    {k:"panels",l:"تعداد پنل",t:"num"},
    {k:"door",l:"درب",t:"chips",o:["ندارد","دارد"]},
    {k:"dir",l:"جهت درب",t:"chips",o:["راست","چپ","کشویی"]},
    f_thick, f_glass, f_frame, f_qty
  ]
};
const PRODUCTS = Object.keys(FIELDS);
const f_order = {k:"order", l:"سفارش", t:"chips", o:["عادی","سه روزه","یک روزه","ساعتی"], wide:1};
function getFields(product, v){
  let L = FIELDS[product]; if(typeof L === "function") L = L(v || {});
  const out = [];
  L.forEach(f=>{ out.push(f); if(f.k==="glass") out.push(f_order); if((f.k==="frame" || f.k==="curColor") && v && v[f.k]==="اختصاصی") out.push({k:f.k+"Custom", l:"رنگ اختصاصی (بنویس، مثلاً توصی فلان)", t:"text", req:1}); });
  return out;
}

/* ---------- ذخیره‌سازی ---------- */
let projects = [], storeOK = true;
const hasWS = !!(window.storage && window.storage.get);
async function loadAll(){
  try{
    if(hasWS){ const r = await window.storage.get("projects"); projects = r ? JSON.parse(r.value) : []; }
    else projects = JSON.parse(localStorage.getItem("projects") || "[]");
  }catch(e){ projects = []; }
}
async function saveAll(){
  try{
    if(hasWS){ const r = await window.storage.set("projects", JSON.stringify(projects)); if(!r) storeOK = false; }
    else localStorage.setItem("projects", JSON.stringify(projects));
  }catch(e){ storeOK = false; }
}

/* ---------- ابزار ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function toast(t){ const el=$("#toast"); el.textContent=t; el.classList.add("on"); setTimeout(()=>el.classList.remove("on"),1700); }
const fa = () => new Date().toLocaleDateString("fa-IR");

let view = "list", search = "", curP = null, curI = null, cur = null;

function demoCutouts(g){
  g.strokeStyle = "#1a1a1a"; g.lineWidth = 3;
  g.beginPath(); g.arc(660,100,22,0,Math.PI*2); g.stroke(); g.strokeRect(220,385,36,36);
  g.fillStyle = "#b3261e"; g.font = "bold 26px Tahoma"; g.textAlign = "center";
  g.fillText("70",660,150); g.fillText("8 × 8",238,375);
}
function demoProject(){
  const it = {product:"بالکن", sketch:null, sketchRaw:null, cutMarks:2, note:"نمونه آزمایشی",
    v:{bmode:"صاف", hf:"100", hc:"57", wb:"345", wt:"346", h:"127", w:"345", fixed:"راست", fixWR:"42", curColor:"سفید", glass:"شفاف", order:"سه روزه", dir:"راست",
       ahTop:"دارد", boxTypeTop:"۴۰×۳۰", boxHTop:"30", ahBot:"ندارد", leavesStd:"غیراستاندارد", leavesN:"۴", pack:"دارد", kat:"دارد", katW:"345", katH:"32", katParts:"2", katGlass:"مات", katThick:"۸ میل", katFrame:"پاسادیو دو تیکه", cutH:"30"}};
  const mk = withAuto => {
    const c = document.createElement("canvas"); c.width = 800; c.height = 500; const g = c.getContext("2d");
    g.fillStyle = "#fff"; g.fillRect(0,0,800,500); demoCutouts(g);
    if(withAuto){ const prev = cur; cur = it; drawLabels(g); cur = prev; }
    return c.toDataURL("image/png");
  };
  it.sketchRaw = mk(false); it.sketch = mk(true);
  return {id:Date.now(), name:"نمونه مشتری", place:"ورزنه", phone:"09121234567", date:fa(), items:[it]};
}
/* ---------- صفحه لیست پروژه‌ها ---------- */
function renderList(){
  const q = search.trim();
  const shown = projects.filter(p => !q || (p.name+" "+p.place+" "+(p.phone||"")).includes(q));
  $("#app").innerHTML = `
    <h1>اندازه‌گیری کارگاه</h1>
    <p class="sub">هر کار با اسم مشتری و محل ثبت می‌شود.</p>
    ${storeOK ? "" : '<div class="warn">ذخیره‌سازی کار نکرد. اطلاعات تا بستن صفحه می‌ماند، پی‌دی‌اف بگیر.</div>'}
    <div class="bar">
      <input class="grow" id="q" type="text" placeholder="جستجو: اسم مشتری یا محل (مثلاً تهران‌پارس)" value="${esc(search)}">
      <button class="primary" id="newP">پروژه جدید</button>
      <button id="demo">نمونه آماده</button>
    </div>
    <div class="bar"><button id="bk">پشتیبان‌گیری</button><button id="rs">بازیابی پشتیبان</button><input type="file" id="rsf" accept="application/json,.json" hidden></div>
    <div id="plist">${shown.length ? shown.map(p=>`
      <button class="proj" data-id="${p.id}">
        <b>${esc(p.name)||"بدون نام"}</b> <span class="meta">${esc(p.place)}</span>${p.phone ? ' · <span class="meta" dir="ltr">'+esc(p.phone)+'</span>' : ""}
        <div class="meta">${p.date} · ${p.items.length} اندازه</div>
      </button>`).join("") : '<div class="empty">پروژه‌ای پیدا نشد.</div>'}</div>`;
  $("#q").oninput = e => { search = e.target.value; const pos=e.target.selectionStart; renderList(); const q2=$("#q"); q2.focus(); q2.setSelectionRange(pos,pos); };
  $("#newP").onclick = async ()=>{
    const p = {id:Date.now(), name:"", place:"", date:fa(), items:[]};
    projects.unshift(p); curP = p; await saveAll(); go("project");
  };

let segs = [], cutCount = 0, dragIdx = -1, dragLine = null;

function initSketch(){

let inkFlag = false;
function pickCoord(axis, pts){
  const R = 30; let best = null, bd = R;
  pts.forEach(P=>{ allSegs().forEach(sg=>{ [[sg.x1,sg.y1],[sg.x2,sg.y2]].forEach(q=>{ const d = Math.hypot(P.x-q[0], P.y-q[1]); if(d < bd){ bd = d; best = (axis==="y") ? q[1] : q[0]; } }); }); });
  if(best !== null) return best;
  const avg = (axis==="y") ? (pts[0].y+pts[1].y)/2 : (pts[0].x+pts[1].x)/2;
  bd = R;
  allSegs().forEach(sg=>{
    if(axis==="y" && Math.abs(sg.y1-sg.y2) < 1){ const d = Math.abs(sg.y1-avg); if(d < bd){ bd = d; best = sg.y1; } }
    if(axis==="x" && Math.abs(sg.x1-sg.x2) < 1){ const d = Math.abs(sg.x1-avg); if(d < bd){ bd = d; best = sg.x1; } }
  });
  return best !== null ? best : avg;
}
function straightGeom(pts, W, H){
  if(!pts || pts.length < 4) return null;
  const a = pts[0], b = pts[pts.length-1], dx = b.x-a.x, dy = b.y-a.y, L = Math.hypot(dx,dy);
  if(L < 50) return null;
  let dev = 0; pts.forEach(p=>{ dev = Math.max(dev, Math.abs((p.x-a.x)*dy-(p.y-a.y)*dx)/L); });
  if(dev > Math.max(18, 0.1*L)) return null;
  const ang = Math.abs(Math.atan2(dy,dx))*180/Math.PI, tol = 15;
  const isH = ang < tol || ang > 180-tol, isV = Math.abs(ang-90) < tol;
  const A0 = {x:a.x, y:a.y}, B0 = {x:b.x, y:b.y};
  if(isH){ const Y = pickCoord("y",[a,b]); A0.y = B0.y = Y; }
  else if(isV){ const X = pickCoord("x",[a,b]); A0.x = B0.x = X; }
  let A = snapPt(A0, A0, B0), B = snapPt(B0, A0, B0);
  if(isH){ A.y = B.y = A0.y; } else if(isV){ A.x = B.x = A0.x; }
  const cl = p => ({x:Math.max(0,Math.min(W,p.x)), y:Math.max(0,Math.min(H,p.y))});
  A = cl(A); B = cl(B);
  if(Math.hypot(B.x-A.x, B.y-A.y) < 8) return null;
  return {A, B};
}
function straightenLast(){
  const sw = $("#straight"); if(!sw || !sw.checked) return;
  const st = strokes[strokes.length-1]; if(!st || !st.pts) return;
  const r = straightGeom(st.pts, cv.width, cv.height); if(!r) return;
  ctx.putImageData(st.snap,0,0);
  ctx.strokeStyle = "#1a1a1a"; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(r.A.x,r.A.y); ctx.lineTo(r.B.x,r.B.y); ctx.stroke();

function snapPt(P, a, b){
  const R = 30; let best = null, bd = R;
  allSegs().forEach(sg=>{ [[sg.x1,sg.y1],[sg.x2,sg.y2]].forEach(q=>{ const d = Math.hypot(P.x-q[0], P.y-q[1]); if(d < bd){ bd = d; best = {x:q[0], y:q[1]}; } }); });
  if(best) return best;
  bd = R*1.5;
  allSegs().forEach(sg=>{
    const sx = sg.x2-sg.x1, sy = sg.y2-sg.y1, dx = b.x-a.x, dy = b.y-a.y, den = dx*sy - dy*sx;
    let c = null;
    if(Math.abs(den) > 1e-6){
      const t = ((sg.x1-a.x)*sy - (sg.y1-a.y)*sx)/den, u = ((sg.x1-a.x)*dy - (sg.y1-a.y)*dx)/den;

function autoGeom(){

  const X = 60, Y = 50, W = 680, H = 400;

      g.strokeStyle = "#777"; g.lineWidth = 2; g.strokeRect(60, top, W-120, bh);
      g.fillStyle = "#f1efe8"; g.fillRect(75, top+15, W-150, 62); g.strokeStyle = "#111"; g.lineWidth = 2; g.strokeRect(75, top+15, W-150, 62);
      g.fillStyle = "#111"; g.font = "bold 32px "+FONT; g.textAlign = "center"; g.fillText((b.i+1)+". "+caseTitle(it), W/2, top+58); g.textAlign = "right";
      const im = imgs[b.i];
      if(im){ const bw = 560, bhh = Math.min(bw*im.height/im.width, bh-120); g.drawImage(im, 85, top+100, bw, bhh); g.strokeStyle = "#999"; g.strokeRect(85, top+100, bw, bhh); }
      g.font = pr.fs+"px "+FONT; let y = top + 140;
      pr.lines.forEach(wl=>{ wl.forEach(ln=>{ if(y < top+bh-8){ g.fillText(ln, W-85, y); y += pr.lh; } }); y += pr.gap; });
    });
    g.textAlign = "center"; g.font = "22px "+FONT; g.fillStyle = "#555"; g.fillText("صفحه "+(pg+1)+" از "+plan.length, W/2, H-30);
    pages.push(c);
  });
  return pages;
}

function buildPDF(jpgs, w, h){
  const enc = new TextEncoder(), chunks = [], offs = []; let pos = 0;
  const put = d => { const u = (typeof d === "string") ? enc.encode(d) : d; chunks.push(u); pos += u.length; };
  const start = n => { offs[n] = pos; put(n+" 0 obj\n"); };
  const N = jpgs.length;
  put("%PDF-1.4\n");
  start(1); put("<< /Type /Catalog /Pages 2 0 R >>\nendobj\n");
  start(2); put("<< /Type /Pages /Kids ["+jpgs.map((_,i)=>(3+3*i)+" 0 R").join(" ")+"] /Count "+N+" >>\nendobj\n");
  jpgs.forEach((u,i)=>{
    const bin = atob(u.split(",")[1]), bytes = new Uint8Array(bin.length);
    for(let k=0;k<bin.length;k++) bytes[k] = bin.charCodeAt(k);
    const pg = 3+3*i, ct = 4+3*i, im = 5+3*i, cs = "q 595 0 0 842 0 0 cm /Im0 Do Q";
    start(pg); put("<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /XObject << /Im0 "+im+" 0 R >> >> /Contents "+ct+" 0 R >>\nendobj\n");
    start(ct); put("<< /Length "+cs.length+" >>\nstream\n"+cs+"\nendstream\nendobj\n");
    start(im); put("<< /Type /XObject /Subtype /Image /Width "+w+" /Height "+h+" /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length "+bytes.length+" >>\nstream\n"); put(bytes); put("\nendstream\nendobj\n");
  });
  const total = 3+3*N, xr = pos;
  put("xref\n0 "+total+"\n0000000000 65535 f \n");
  for(let n=1;n<total;n++) put(String(offs[n]).padStart(10,"0")+" 00000 n \n");
  put("trailer\n<< /Size "+total+" /Root 1 0 R >>\nstartxref\n"+xr+"\n%%EOF");
  return new Blob(chunks, {type:"application/pdf"});
}
async function makePDF(){
  toast("در حال ساخت برگه…");
  const pages = (await makePages()).map(c=>c.toDataURL("image/jpeg",0.92));
  const blob = buildPDF(pages, 1240, 1754);
  const url = URL.createObjectURL(blob);
  const fname = "measure-"+new Date().toISOString().slice(0,10)+".pdf";
  const ov = document.createElement("div");
  ov.style.cssText = "position:fixed;inset:0;z-index:20;background:var(--bg);overflow:auto;padding:12px";
  ov.innerHTML = `<div class="bar"><button class="primary" id="dl">دانلود PDF</button><button id="sh">ارسال</button><button id="op">باز کردن PDF</button><button id="cl">بستن</button></div>`
    + (hasWS ? '<div class="warn">داخل خود Claude دانلود و ارسال محدود است. برای کار کامل، فایل را مستقیم در Chrome باز کن (نسخه مستقل).</div>' : '')
    + '<div class="meta" style="margin-bottom:8px">اگر دانلود کار نکرد، «باز کردن PDF» را بزن یا روی عکس هر صفحه نگه دار و ذخیره کن.</div>'
    + pages.map(u=>`<img src="${u}" alt="صفحه" style="width:100%;max-width:720px;display:block;margin:0 auto 12px;background:#fff;border:1px solid var(--line)">`).join("");
  document.body.appendChild(ov);
  ov.querySelector("#cl").onclick = ()=> ov.remove();
  ov.querySelector("#dl").onclick = ()=>{ try{ const a = document.createElement("a"); a.href = url; a.download = fname; document.body.appendChild(a); a.click(); a.remove(); toast("دانلود شد، پوشه Downloads را نگاه کن"); }catch(e){ toast("دانلود نشد"); } };
  ov.querySelector("#op").onclick = ()=>{ const w = window.open(url, "_blank"); if(!w) toast("باز نشد"); };
  ov.querySelector("#sh").onclick = async ()=>{ try{ const f = new File([blob], fname, {type:"application/pdf"}); if(navigator.canShare && navigator.canShare({files:[f]})) await navigator.share({files:[f], title:"برگه اندازه‌گیری"}); else toast("ارسال در این مرورگر ممکن نیست، دانلود کن"); }catch(e){ if(e && e.name!=="AbortError") toast("ارسال نشد"); } };
}
